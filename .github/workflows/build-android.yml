name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Cache Expo modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ~/.cache/expo
          key: ${{ runner.os }}-expo-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-expo-

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_DEV_TOOLS: 1

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          android-version: 34
          build-tools-version: 34.0.0
          ndk-version: 25.2.9519653
          cmake-version: 3.22.1

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ steps.setup-android.outputs.ndk-version }}

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/debug
          mv app-debug.apk wora-mobile-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wora-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/wora-mobile-debug.apk
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: wora-mobile-debug-apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: wora-mobile-debug.apk
          name: Wora Mobile v0.4.0-beta2
          tag_name: v0.4.0-beta2-mobile
          body: |
            ## Wora Mobile - Android APK
            
            A beautiful mobile music player for audiophiles with offline lyrics support.
            
            ### Features
            - Music Library: Organize and browse your music collection
            - Playlists: Create and manage custom playlists
            - Lyrics: View synchronized and unsynced lyrics
            - **Offline Lyrics**: Cache lyrics for playlists to view offline (NEW!)
            - Album Art: Display album covers from your music files
            - Search: Find songs, albums, and playlists quickly
            - Playback Controls: Play, pause, skip, shuffle, repeat
            - Now Playing: Full-screen player with progress bar
            - Dark Theme: Beautiful dark UI optimized for mobile
            
            ### What's New
            - Complete mobile port of Wora Desktop
            - Offline lyrics caching for playlists
            - Android 16+ support
            
            ### Requirements
            - Android 6.0+ (API 23+)
            
            ### Installation
            Download and install the APK file directly to your Android device.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
